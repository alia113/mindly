<title>MINDLY AI</title>
<style>
:root{--bg:#050505;--card:#111214;--card2:#17181b;--line:#24262a;--tx:#f4f4f5;--mut:#8b8d93;--acc:#8ab4ff;--pink:#ff7ad9;--ok:#6ee7b7;--warn:#fdba74}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
header.top{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) 18px 8px}
.word{font-weight:700;letter-spacing:.28em;font-size:13px}
.word small{color:var(--mut);font-weight:500;letter-spacing:.12em}
main{flex:1;overflow-y:auto;padding:6px 16px 110px;-webkit-overflow-scrolling:touch}
h1{font-size:22px;margin:10px 2px 4px;font-weight:650}
.sub{color:var(--mut);font-size:13px;margin:0 2px 14px}
.sec{margin:18px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.sec h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:0;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:8px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.t{font-size:15px;line-height:1.35}
.m{font-size:12px;color:var(--mut);margin-top:2px}
.empty{color:var(--mut);font-size:13px;padding:10px 4px}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut);margin-right:4px}
.chip.confirmed{color:var(--ok);border-color:#1f4d3d}.chip.assumption{color:var(--warn);border-color:#5a3a1a}.chip.suggestion{color:var(--pink);border-color:#5a1f4d}
.btn{padding:7px 12px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:13px}
.btn.p{background:#fff;color:#000;border-color:#fff;font-weight:600}
.btn.d{color:#ff8a8a}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
nav.bar{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:center;padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);background:rgba(10,10,12,.85);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
nav.bar button{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--mut);gap:3px;min-width:56px;padding:4px}
nav.bar button.on{color:#fff}
nav.bar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.bar .vb{width:54px;height:54px;border-radius:50%;margin-top:-26px;background:conic-gradient(from 200deg,#3b82f6,#22d3ee,#a78bfa,#ec4899,#fb923c,#3b82f6);padding:2px;min-width:0}
nav.bar .vb span{display:flex;width:100%;height:100%;border-radius:50%;background:#0a0a0c;align-items:center;justify-content:center;color:#fff}
.tabs{display:flex;background:var(--card);border-radius:99px;padding:3px;margin:8px 0 12px}
.tabs button{flex:1;padding:8px;border-radius:99px;font-size:14px;color:var(--mut)}
.tabs button.on{background:var(--card2);color:#fff}
input,textarea,select{width:100%;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:11px 13px;font:inherit;font-size:15px;outline:none}
.tl{border-left:1px solid var(--line);margin-left:6px;padding-left:14px}
.tl .it{position:relative;margin-bottom:12px}.tl .it:before{content:"";position:absolute;left:-19px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--acc)}
.kv{font-size:13px;color:var(--mut);margin:2px 0}.kv b{color:var(--tx);font-weight:500}
/* voice */
#voice{position:fixed;inset:0;background:#050505;z-index:20;display:none;flex-direction:column;max-width:560px;margin:0 auto}
#voice.on{display:flex}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#voice .vt{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 16px) 20px 0}
#conn{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:6px}
#conn i{width:6px;height:6px;border-radius:50%;background:#555;display:inline-block}
#conn.ok i{background:var(--ok)}
.vmid{flex:1}
.vlow{position:relative;z-index:2;padding:0 24px calc(env(safe-area-inset-bottom) + 26px);text-align:center}
#vstat{font-size:15px;letter-spacing:.06em;color:#e8e8ea;min-height:22px}
#vtx{font-size:15px;color:#a3a5ab;min-height:46px;max-height:92px;overflow:hidden;margin:8px auto 18px;line-height:1.45;font-weight:300}
.vc{display:flex;align-items:center;justify-content:center;gap:22px}
.rb{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:#ddd}
.rb svg,.mic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rb.end{background:rgba(255,70,70,.16);border-color:rgba(255,90,90,.3);color:#ff8f8f}
.rb.off{color:#ff8f8f}
.mic{width:78px;height:78px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px rgba(255,255,255,.08)}
.mic svg{width:30px;height:30px}
.mic.convo{box-shadow:0 0 0 3px rgba(130,150,255,.45)}.mic.rec{background:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.16),0 0 40px rgba(130,150,255,.4)}
#vtext{display:none;margin-bottom:14px}
#vtext.on{display:flex;gap:8px}
#vtext input{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12)}
.lang{font-size:12px;color:#aaa;border:1px solid rgba(255,255,255,.14);border-radius:99px;padding:4px 10px}
html[dir=rtl] .sec h2,html[dir=rtl] .word,html[dir=rtl] #vstat{letter-spacing:0}html[dir=rtl] .tl{border-left:0;border-right:1px solid var(--line);margin-left:0;margin-right:6px;padding-left:0;padding-right:14px}html[dir=rtl] .tl .it:before{left:auto;right:-19px}html[dir=rtl] .chip{margin-right:0;margin-left:4px}html[dir=rtl] .vc{direction:ltr}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#fff;color:#000;padding:9px 16px;border-radius:99px;font-size:13px;z-index:40;max-width:90%;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.chat{display:flex;flex-direction:column;gap:8px}
.bub{padding:10px 13px;border-radius:16px;max-width:88%;font-size:15px;line-height:1.4;white-space:pre-wrap}
.bub.u{align-self:flex-end;background:#fff;color:#000}.bub.a{align-self:flex-start;background:var(--card2);border:1px solid var(--line)}
.src{font-size:11px;color:var(--mut);margin-top:6px;border-top:1px solid var(--line);padding-top:5px}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.dlg .sheet{background:#121316;border-radius:22px 22px 0 0;padding:18px;width:100%;max-width:560px;border:1px solid var(--line);max-height:calc(100vh - 24px);max-height:calc(100dvh - env(safe-area-inset-top,0px) - 16px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-top:0;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
.dlg .shead{position:sticky;top:0;z-index:3;display:flex;justify-content:flex-end;margin:0 -18px 6px;padding:10px 12px 6px;background:#121316;border-radius:22px 22px 0 0}
.dlg .sx{width:38px;height:38px;border-radius:19px;border:1px solid var(--line);background:#1c1d22;color:#eee;font-size:18px;line-height:1;cursor:pointer;padding:0}
.sw{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.sw input{width:auto}

html,body{height:100%;min-height:100%;overflow:hidden}
#app{position:fixed;top:0;bottom:0;left:0;right:0;width:100%;height:auto;margin:0 auto}
main{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
nav.bar{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6px);background:rgba(10,10,12,.94)}
input,textarea,select{font-size:16px}
.t,.m,.card,.grow,.sub,.empty,h1{overflow-wrap:anywhere}
header.top button{min-height:44px;min-width:44px}
.btn{min-height:40px;padding:9px 14px}
.dlg .acts .btn,.acts .btn{min-height:40px}
@media(max-width:360px){main{padding-left:12px;padding-right:12px}header.top{padding-left:12px;padding-right:12px}h1{font-size:20px}.btn{padding:8px 11px;font-size:12.5px}nav.bar{padding-left:2px;padding-right:2px}}
@media(min-width:700px){#app{max-width:640px}.dlg .sheet{max-width:640px;border-radius:22px;margin-bottom:16px}}
@media(max-height:500px){.dlg .sheet{max-height:calc(100dvh - 8px)}}

nav.bar{left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);padding:6px;border-radius:34px;justify-content:space-between;gap:2px;background:rgba(44,44,50,.5);-webkit-backdrop-filter:blur(26px) saturate(1.7);backdrop-filter:blur(26px) saturate(1.7);border:1px solid rgba(255,255,255,.16);box-shadow:0 10px 32px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.05)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){nav.bar{background:rgba(30,30,35,.98)}}
nav.bar button{flex:1;min-width:0;min-height:52px;justify-content:center;border-radius:26px;padding:6px 2px;transition:background .2s}
